name: Android Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          else
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

      - name: Build Android APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "./Elias-Stickers.apk"
          fi

      - name: Compute Checksum
        run: |
          if [ -f "./Elias-Stickers.apk" ]; then
            sha256sum "./Elias-Stickers.apk" > "./Elias-Stickers.apk.sha256"
            cat "./Elias-Stickers.apk.sha256"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elias-Stickers-APK
          path: |
            ./Elias-Stickers.apk
            ./Elias-Stickers.apk.sha256
          retention-days: 60

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Elias Stickers {0}', github.ref_name) || 'Elias Stickers v1.0.0' }}
          draft: false
          prerelease: false
          files: |
            ./Elias-Stickers.apk
            ./Elias-Stickers.apk.sha256
          body: |
            ## 📱 Elias Stickers v1.0.0
            **Turn Any Photo into a Custom Sticker Set with AI**

            ### ⬇️ Direct APK Download
            - **Download File:** [`Elias-Stickers.apk`](./Elias-Stickers.apk)
            - **Package ID:** `com.elias.stickers`
            - **Minimum Android:** Android 8.0+ (Oreo, API 26+)
            - **Author:** Created with ❤️ by Elias

            ### Features included in this release:
            - 📸 Instant Camera capture & Photo Picker
            - 🎨 15 Custom Sticker Art Styles
            - 🎭 8+ Comic Expression Badges with Die-Cut Borders
            - 💾 Single PNG download, Printable Sticker Sheet, and ZIP pack export
            - 🌐 Full English and বাংলা bilingual interface
